name: kech_app
description: Kech - gestor de gastos y recibos
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_ui: ^1.0.0
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  intl: ^0.20.2
  image_picker: ^1.2.4
  tesseract_ocr: ^0.6.0
  path_provider: ^2.1.6
  sqflite: ^2.4.6
  cryptography: ^2.9.0
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/kech_logo.jpeg
    - assets/tessdata_config.json
    - assets/tessdata/kech.traineddata


  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/PlusJakartaSans.ttf


