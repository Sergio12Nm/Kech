</div>
</div>
<div class="flex flex-col gap-1.5 max-w-[85%]">

</button>
<button class="px-3.5 py-2 rounded-full bg-surface-container-high active:bg-primary active:text-on-primary text-tertiary font-label-md text-label-md transition-all shadow-sm flex items-center gap-1.5 hover:bg-surface-variant" onclick="handleSuggestionClick(this)" type="button">
<span>Muéstrame mis últimos gastos</span>

</button>
<button class="px-3.5 py-2 rounded-full bg-surface-container-high active:bg-primary active:text-on-primary text-tertiary font-label-md text-label-md transition-all shadow-sm flex items-center gap-1.5 hover:bg-surface-variant" onclick="handleSuggestionClick(this)" type="button">

</div>

<span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
<!-- Micro Context Footnote -->

</div>
</div>
<script>
  function sendMessage() {
    const input = document.getElementById('chatInput');
    const query = input.value.trim();
    if (!query) return;

    const thread = document.getElementById('chatThread');

    // Create user bubble
    const userWrap = document.createElement('div');
    userWrap.className = 'flex justify-end w-full animate-fade-in';
    userWrap.innerHTML = `
      <div class="flex flex-col items-end gap-1 max-w-[80%]">
        <div class="bg-primary text-on-primary rounded-2xl rounded-tr-sm px-4 py-2.5 shadow-sm">
          <p class="font-body-md text-body-md">${escapeHtml(query)}</p>
        </div>
        <span class="font-label-sm text-label-sm text-outline px-1">Ahora · Vía texto</span>
      </div>
    `;
    thread.appendChild(userWrap);
    input.value = '';

    // Scroll smoothly to bottom
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

    // Simulate Assistant reply
    setTimeout(() => {
      const botWrap = document.createElement('div');
      botWrap.className = 'flex items-start gap-space-sm w-full';
      botWrap.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container flex-shrink-0 mt-1 shadow-sm">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
        </div>
        <div class="flex flex-col gap-1.5 max-w-[85%]">
          <div class="bg-surface-container-lowest rounded-2xl rounded-tl-sm p-4 shadow-sm flex flex-col gap-2">
            <p class="font-body-md text-body-md text-on-surface">
              Revisé tus comprobantes recientes. Todo está sincronizado con tu balance del día.
            </p>
            <div class="flex items-center gap-2 bg-secondary-container/30 px-3 py-1.5 rounded-lg">
              <span class="material-symbols-outlined text-secondary text-[18px]">verified</span>
              <span class="font-label-sm text-label-sm text-on-secondary-container font-semibold">Registro validado por Kech</span>
            </div>
          </div>
          <span class="font-label-sm text-label-sm text-outline px-1">Ahora</span>
        </div>
      `;
      thread.appendChild(botWrap);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }, 600);
  }

  function handleSuggestionClick(btn) {
    const text = btn.querySelector('span').innerText;
    document.getElementById('chatInput').value = text;
    sendMessage();
  }

  function toggleMic() {
    const mic = document.getElementById('micBtn');
    mic.classList.toggle('bg-error-container');
    mic.classList.toggle('text-on-error-container');
    
    const input = document.getElementById('chatInput');
    if (!input.value) {
      input.placeholder = "Escuchando tu voz...";
      setTimeout(() => {
        input.placeholder = "Escribe una consulta a Kech...";
        mic.classList.remove('bg-error-container');
        mic.classList.remove('text-on-error-container');
      }, 3000);
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
  }
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-4px_16px_rgba(38,58,91,0.05)]" data-active-classes="text-primary font-semibold"><div class="h-16 px-space-md flex items-center justify-around"><a class="flex flex-col items-center justify-center gap-space-xs text-on-surface-variant hover:text-on-surface min-w-[56px] min-h-[48px] transition-colors" data-path="inicio" href="#"><span class="material-symbols-outlined text-[24px]">home</span><span class="font-label-sm text-label-sm">Inicio</span></a><a class="flex flex-col items-center justify-center gap-space-xs text-on-surface-variant hover:text-on-surface min-w-[56px] min-h-[48px] transition-colors" data-path="registros" href="#"><span class="material-symbols-outlined text-[24px]">receipt_long</span><span class="font-label-sm text-label-sm">Registros</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[48px] transition-colors text-primary font-semibold" data-path="asistente" href="#"><div class="relative flex items-center justify-center"><span class="material-symbols-outlined text-[24px]">smart_toy</span><span class="absolute -top-0.5 -right-1 w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_#356853]"></span></div><span class="font-label-sm text-label-sm">Asistente</span></a></div></nav>
