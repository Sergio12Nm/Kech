<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-error": "#ffffff", "surface-container-lowest": "#ffffff", "tertiary": "#38586e", "on-surface-variant": "#43474d", "on-secondary-container": "#3a6c57", "secondary-fixed-dim": "#9dd2b8", "on-primary-fixed": "#001d34", "tertiary-fixed": "#c8e6ff", "primary-fixed-dim": "#acc9eb", "inverse-surface": "#1c3051", "on-secondary-fixed-variant": "#1c503c", "primary-fixed": "#cfe5ff", "on-secondary-fixed": "#002115", "tertiary-container": "#517087", "inverse-on-surface": "#ecf0ff", "secondary-container": "#b5ebd1", "primary": "#395773", "on-tertiary": "#ffffff", "on-tertiary-fixed": "#001e2f", "tertiary-fixed-dim": "#aacbe4", "secondary-fixed": "#b8eed4", "inverse-primary": "#acc9eb", "on-surface": "#031b3b", "surface-variant": "#d6e3ff", "outline": "#73777e", "on-tertiary-container": "#e2f1ff", "on-primary-fixed-variant": "#2b4965", "on-secondary": "#ffffff", "on-tertiary-fixed-variant": "#2a4a60", "surface": "#f9f9ff", "surface-container-highest": "#d6e3ff", "on-primary-container": "#e6f0ff", "on-error-container": "#93000a", "on-primary": "#ffffff", "surface-container-high": "#dfe8ff", "secondary": "#356853", "error": "#ba1a1a", "error-container": "#ffdad6", "outline-variant": "#c3c7ce", "on-background": "#031b3b", "surface-container": "#e8eeff", "surface-tint": "#44617e", "surface-container-low": "#f0f3ff", "background": "#f9f9ff", "surface-dim": "#c9daff", "primary-container": "#526f8d", "surface-bright": "#f9f9ff" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-lg": "1.5rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "margin-tablet": "1.5rem", "space-xl": "2rem", "margin": "1rem", "space-md": "1rem", "gutter": "1rem" }, fontFamily: { "body-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "currency-display": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"] }, fontSize: { "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }], "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.03em", fontWeight: "600" }], "headline-lg": ["22px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }], "currency-display": ["34px", { lineHeight: "40px", letterSpacing: "-0.03em", fontWeight: "700" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-xl": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }], "headline-xl-mobile": ["26px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "700" }], "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased pt-safe pb-safe flex flex-col"><main class="flex flex-col relative w-full min-h-screen bg-surface"><div class="flex flex-col w-full px-margin pb-10">
<!-- Subtle decorative ambient elements -->
<div class="relative w-full flex flex-col items-center pt-4">
<!-- Companion greeting pill / Delight marker -->

<!-- Centered Brand Header -->
<div class="flex flex-col items-center text-center max-w-xs">
<div class="w-20 h-16 mb-2 flex items-center justify-center p-1 bg-surface-container-lowest rounded-2xl shadow-sm">
<img alt="Kech Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqt0c9tLwv6KicTasekMAKxm9VULJpAMNofER1vNQgaMB2fFvqt8eO3m-oRYVfwQFr2bLImgCj1mUX5l7u6SR3uqaJQ1CXEoAxy65Kjcf__1wYeY8ivXbtC4ScfnHiKMFEQyWmkqXuIuVTih9EYi5ZC_SuOfWF4UPd4xNLg762BpQioLcDoVhvkaTEKRQK1at7dU7d5n9YMvuNtgjJh5IAsZ4Mad1Rr4nG3VQbAKLAfjNDm5aWkUPl">
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight font-bold">
        KECH
      </h1>
<p class="font-label-md text-label-md text-primary font-semibold mt-0.5 tracking-wide uppercase">
        Gestor de gastos y recibos
      </p>
<!-- Warm merchant welcome message -->

</div>
</div>
<!-- Main Login Card -->
<div class="mt-6 w-full bg-surface-container-lowest rounded-lg p-5 shadow-md flex flex-col gap-4">
<div class="flex items-center justify-between pb-1">
<div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Iniciar sesión</h2>

</div>

</div>
<!-- Form Section -->
<form class="flex flex-col gap-4" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email or Username Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="userAccount">
<span class="material-symbols-outlined text-[16px] text-primary">mail</span>
          Correo electrónico o usuario
        </label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-11 pr-4 rounded-full bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container transition-all" id="userAccount" name="account" placeholder="ej. carlos@micomercio.com" required="" type="text">
<span class="material-symbols-outlined absolute left-4 text-outline pointer-events-none text-[20px]">
            alternate_email
          </span>
</div>
</div>
<!-- Password Field with Interactive Toggle -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="userPassword">
<span class="material-symbols-outlined text-[16px] text-primary">lock</span>
            Contraseña
          </label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">
            ¿Olvidaste tu contraseña?
          </a>
</div>
<div class="relative flex items-center">
<input class="w-full h-12 pl-11 pr-12 rounded-full bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container transition-all" id="userPassword" name="password" placeholder="••••••••••••" required="" type="password">
<span class="material-symbols-outlined absolute left-4 text-outline pointer-events-none text-[20px]">
            key
          </span>
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-2 w-10 h-10 flex items-center justify-center text-outline hover:text-on-surface rounded-full transition-colors active:scale-95" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Quick Session Helper / Merchant Convenience -->
<div class="flex items-center justify-between pt-1">


</div>
<!-- Primary Submit Action -->
<button class="mt-2 w-full h-12 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg tracking-wider uppercase flex items-center justify-center gap-2 shadow-sm hover:opacity-95 active:scale-[0.98] transition-all" id="loginSubmitBtn" type="submit">
<span>INICIAR SESIÓN</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
</div>
<!-- Bottom Registration Section -->
<div class="mt-6 flex flex-col items-center text-center gap-3">
<div class="flex items-center gap-3 w-full">
<div class="h-px bg-surface-container-highest flex-1"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant">¿No tienes una cuenta?</span>
<div class="h-px bg-surface-container-highest flex-1"></div>
</div>
<!-- Secondary Action Button -->
<a class="w-full h-12 rounded-full bg-secondary-container text-on-secondary-container font-label-lg text-label-lg tracking-wide uppercase flex items-center justify-center gap-2 shadow-sm active:scale-[0.98] transition-all" href="#">
<span class="material-symbols-outlined text-[20px]">store</span>
<span>CREAR CUENTA</span>
</a>
</div>
<!-- Floating Merchant Assistant Delight Card ("Hola, soy Chek...") -->
<div class="mt-6 w-full rounded-2xl bg-surface-container-low p-3.5 flex items-start gap-3 shadow-sm">
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center text-on-secondary shrink-0 shadow-sm mt-0.5">
<span class="material-symbols-outlined text-[18px]">receipt_long</span>
</div>
<div class="flex flex-col min-w-0">
<p class="font-label-md text-label-md text-on-surface">Chek · Tu asistente contable</p>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
        Digitaliza tickets de compra con una foto al instante. Mantén tu balance al día sin papeles perdidos.
      </p>
</div>
</div>
<!-- Security Footer Note -->

</div>
<script>
  (function initLoginPage() {
    const passwordInput = document.getElementById('userPassword');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    const submitBtn = document.getElementById('loginSubmitBtn');
    const form = document.getElementById('loginForm');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (form && submitBtn) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined animate-spin text-[20px]">sync</span>
          <span>CONECTANDO...</span>
        `;
        submitBtn.disabled = true;

        setTimeout(() => {
          submitBtn.innerHTML = `
            <span class="material-symbols-outlined text-[20px]">check</span>
            <span>¡BIENVENIDO!</span>
          `;
          setTimeout(() => {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
          }, 1500);
        }, 1000);
      });
    }
  })();
</script></main>









</body></html>
