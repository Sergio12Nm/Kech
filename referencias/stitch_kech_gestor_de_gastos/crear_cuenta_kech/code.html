<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-error": "#ffffff", "surface-container-lowest": "#ffffff", "tertiary": "#38586e", "on-surface-variant": "#43474d", "on-secondary-container": "#3a6c57", "secondary-fixed-dim": "#9dd2b8", "on-primary-fixed": "#001d34", "tertiary-fixed": "#c8e6ff", "primary-fixed-dim": "#acc9eb", "inverse-surface": "#1c3051", "on-secondary-fixed-variant": "#1c503c", "primary-fixed": "#cfe5ff", "on-secondary-fixed": "#002115", "tertiary-container": "#517087", "inverse-on-surface": "#ecf0ff", "secondary-container": "#b5ebd1", "primary": "#395773", "on-tertiary": "#ffffff", "on-tertiary-fixed": "#001e2f", "tertiary-fixed-dim": "#aacbe4", "secondary-fixed": "#b8eed4", "inverse-primary": "#acc9eb", "on-surface": "#031b3b", "surface-variant": "#d6e3ff", "outline": "#73777e", "on-tertiary-container": "#e2f1ff", "on-primary-fixed-variant": "#2b4965", "on-secondary": "#ffffff", "on-tertiary-fixed-variant": "#2a4a60", "surface": "#f9f9ff", "surface-container-highest": "#d6e3ff", "on-primary-container": "#e6f0ff", "on-error-container": "#93000a", "on-primary": "#ffffff", "surface-container-high": "#dfe8ff", "secondary": "#356853", "error": "#ba1a1a", "error-container": "#ffdad6", "outline-variant": "#c3c7ce", "on-background": "#031b3b", "surface-container": "#e8eeff", "surface-tint": "#44617e", "surface-container-low": "#f0f3ff", "background": "#f9f9ff", "surface-dim": "#c9daff", "primary-container": "#526f8d", "surface-bright": "#f9f9ff" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-lg": "1.5rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "margin-tablet": "1.5rem", "space-xl": "2rem", "margin": "1rem", "space-md": "1rem", "gutter": "1rem" }, fontFamily: { "body-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "currency-display": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"] }, fontSize: { "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }], "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.03em", fontWeight: "600" }], "headline-lg": ["22px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }], "currency-display": ["34px", { lineHeight: "40px", letterSpacing: "-0.03em", fontWeight: "700" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-xl": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }], "headline-xl-mobile": ["26px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "700" }], "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-on-surface antialiased pt-safe pb-safe flex flex-col"><main class="flex flex-col relative w-full min-h-screen bg-surface"><div class="flex flex-col w-full pb-8">
<!-- Interactive Progress Header -->
<div class="px-space-md pt-2 pb-4">
<div class="flex items-center justify-between mb-4">
<button aria-label="Volver atrás" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>

</div>
<!-- Title & Welcoming Mascot Chek Micro-Greeting -->
<div class="relative bg-surface-container-low rounded-2xl p-4 shadow-sm mb-2 overflow-hidden">
<div class="absolute -right-4 -bottom-6 w-24 h-24 rounded-full bg-secondary-container/30 pointer-events-none"></div>
<div class="relative z-10">
<div class="flex items-center gap-2 mb-1">

<span class="font-label-md text-secondary">KECH • Gestor de gastos y recibos</span>
</div>
<h1 class="font-headline-xl-mobile text-on-surface tracking-tight">Crear cuenta</h1>

</div>
</div>
</div>
<!-- Registration Form Body -->
<form class="px-space-md flex flex-col space-y-4" id="signup-form" onsubmit="event.preventDefault(); triggerCelebration();">
<!-- Section 1: Personal Profile Data -->
<div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm space-y-3.5">
<div class="flex items-center gap-2 pb-1 text-primary">
<span class="material-symbols-outlined text-[18px]">person</span>
<span class="font-label-md uppercase tracking-wider text-primary">Datos personales</span>
</div>
<!-- Nombre -->
<div class="flex flex-col space-y-1">
<label class="font-label-md text-on-surface" for="nombre">Nombre</label>
<div class="relative flex items-center">
<input class="w-full h-[48px] px-3.5 bg-surface-container-low rounded-xl font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" id="nombre" name="nombre" placeholder="Ej. María" required="" type="text">
<span class="material-symbols-outlined absolute right-3 text-outline text-[18px] pointer-events-none">badge</span>
</div>
</div>
<!-- Apellidos -->
<div class="flex flex-col space-y-1">
<label class="font-label-md text-on-surface" for="apellidos">Apellidos</label>
<div class="relative flex items-center">
<input class="w-full h-[48px] px-3.5 bg-surface-container-low rounded-xl font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" id="apellidos" name="apellidos" placeholder="Ej. González Pérez" required="" type="text">
<span class="material-symbols-outlined absolute right-3 text-outline text-[18px] pointer-events-none">id_card</span>
</div>
</div>
</div>
<!-- Section 2: Business & Contact -->

<!-- Section 3: Security & Passwords -->
<div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm space-y-3.5">
<div class="flex items-center gap-2 pb-1 text-primary">
<span class="material-symbols-outlined text-[18px]">lock</span>
<span class="font-label-md uppercase tracking-wider text-primary">Seguridad</span>
</div>
<!-- Contraseña -->
<div class="flex flex-col space-y-1">
<label class="font-label-md text-on-surface" for="password">Contraseña</label>
<div class="relative flex items-center">
<input class="w-full h-[48px] px-3.5 pr-11 bg-surface-container-low rounded-xl font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" id="password" name="password" oninput="checkPasswordRules(this.value)" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface" onclick="togglePasswordVisibility('password', this)" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<!-- Live Requirement Pills -->
<div class="flex flex-wrap gap-2 pt-0.5">
<div class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-surface-container text-outline transition-colors" id="rule-length">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
<span class="font-label-sm">8+ caracteres</span>
</div>
<div class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-surface-container text-outline transition-colors" id="rule-number">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
<span class="font-label-sm">Al menos 1 número</span>
</div>
</div>
<!-- Confirmar contraseña -->
<div class="flex flex-col space-y-1 pt-1">
<label class="font-label-md text-on-surface" for="confirm_password">Confirmar contraseña</label>
<div class="relative flex items-center">
<input class="w-full h-[48px] px-3.5 pr-11 bg-surface-container-low rounded-xl font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" id="confirm_password" name="confirm_password" oninput="validateMatch()" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface" onclick="togglePasswordVisibility('confirm_password', this)" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
<p class="font-body-sm text-secondary hidden pt-0.5 flex items-center gap-1" id="match-feedback">
<span class="material-symbols-outlined text-[14px]">done_all</span>
          Las contraseñas coinciden
        </p>
</div>
</div>
<!-- Friendly Consent Checkbox Card -->
<div class="bg-surface-container-low rounded-2xl p-3.5 flex items-start space-x-3">
<div class="pt-0.5">
<input class="w-5 h-5 rounded-md text-secondary focus:ring-0 accent-secondary cursor-pointer" id="terms" name="terms" required="" type="checkbox">
</div>
<label class="font-body-sm text-on-surface-variant cursor-pointer select-none leading-relaxed" for="terms">
        Acepto los <span class="text-primary font-semibold underline decoration-primary/40">Términos y Condiciones</span> y la <span class="text-primary font-semibold underline decoration-primary/40">Política de Privacidad</span> de Kech.
      </label>
</div>
<!-- Main Action Button -->
<div class="pt-2">
<button class="w-full h-[52px] bg-secondary active:bg-secondary/90 text-on-secondary rounded-full font-label-lg tracking-wider flex items-center justify-center space-x-2 shadow-md active:scale-[0.99] transition-all" id="submit-btn" type="submit">

<span>CREAR CUENTA</span>
</button>
</div>
<!-- Delight Assistant Bubble: Chek Advisor -->

<!-- Bottom Anchor Navigation -->
<div class="pt-4 text-center">
<p class="font-body-md text-on-surface">
        ¿Ya tienes una cuenta? 
        <a class="font-label-lg text-primary underline underline-offset-4 font-semibold hover:opacity-80 transition-opacity" href="#">
          Iniciar sesión
        </a>
</p>
</div>
</form>
</div>
<script>
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function checkPasswordRules(val) {
    const ruleLen = document.getElementById('rule-length');
    const ruleNum = document.getElementById('rule-number');

    if (val.length >= 8) {
      ruleLen.classList.remove('bg-surface-container', 'text-outline');
      ruleLen.classList.add('bg-secondary-container', 'text-on-secondary-container');
    } else {
      ruleLen.classList.add('bg-surface-container', 'text-outline');
      ruleLen.classList.remove('bg-secondary-container', 'text-on-secondary-container');
    }

    if (/\d/.test(val)) {
      ruleNum.classList.remove('bg-surface-container', 'text-outline');
      ruleNum.classList.add('bg-secondary-container', 'text-on-secondary-container');
    } else {
      ruleNum.classList.add('bg-surface-container', 'text-outline');
      ruleNum.classList.remove('bg-secondary-container', 'text-on-secondary-container');
    }
    validateMatch();
  }

  function validateMatch() {
    const pass = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;
    const feedback = document.getElementById('match-feedback');

    if (confirm && pass === confirm) {
      feedback.classList.remove('hidden');
    } else {
      feedback.classList.add('hidden');
    }
  }

  function triggerCelebration() {
    const btn = document.getElementById('submit-btn');
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Preparando tu negocio...</span>`;
    btn.classList.add('opacity-90', 'pointer-events-none');

    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check_circle</span><span>&iexcl;Bienvenido a Kech!</span>`;
      btn.classList.replace('bg-secondary', 'bg-primary');
    }, 1200);
  }
</script></main>



</body></html>
