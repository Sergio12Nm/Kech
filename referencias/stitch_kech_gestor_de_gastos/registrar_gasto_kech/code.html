  </head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Volver" class="w-11 h-11 -ml-1 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><img alt="Kech Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpSvVw7_GVSocnL0nozGGrLDIX9jLxplndt9242A9GH41JkL2VkIUwO-3gBDtHxnFdmGZqgOZmoFL91-s-ltW2I5LM8lyERyA7BA0H9D44FT_RYwIQbeaxt8kfEaFFm5mfpZ2Y3W3twzH517bR6CahnEkImF4aofThkHnuITHm63IEFT6g4q28Ne9WDgW3264G7hAbuF4JUapZkq315THfdlcJOCcR9zHwuR04PVGtqdmp1_cFs9fT"><h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold">Registrar Gasto</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-8">
<!-- Friendly Assistant Hint / Greeting -->
<div class="px-margin pt-4 pb-2">
<div class="flex items-center gap-3 bg-surface-container-low p-3 rounded-2xl shadow-sm">
<div class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center flex-shrink-0 text-on-secondary shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: &quot;FILL&quot; 1;">receipt_long</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-md text-label-md text-on-surface">Nuevo comprobante</p>
<p class="font-body-sm text-body-sm text-on-surface-variant truncate">Ingresa el importe y los detalles de la compra.</p>
</div>
</div>
</div>
<form class="flex flex-col gap-5 px-margin pt-2" id="expense-form" onsubmit="event.preventDefault();">
<!-- Big Currency Amount Display Card -->
<div class="bg-surface-container-lowest rounded-2xl p-5 shadow-sm flex flex-col items-center justify-center relative overflow-hidden">
<div class="w-full flex items-center justify-between mb-2">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[15px] text-primary">payments</span>
          Monto Total
        </span>
<!-- Currency Pill Selector -->
<button class="flex items-center gap-1.5 bg-surface-container-low hover:bg-surface-container px-3 py-1 rounded-full text-primary transition-all active:scale-95" type="button">
<span class="font-label-sm text-label-sm font-semibold">MXN (Pesos)</span>
<span class="material-symbols-outlined text-[14px]">expand_more</span>
</button>
</div>
<!-- Live Editable Amount Input Display -->
<div class="w-full flex items-baseline justify-center gap-1 py-3">
<span class="font-currency-display text-currency-display text-primary select-none">$</span>
<input aria-label="Importe del gasto" class="font-currency-display text-currency-display text-on-surface bg-transparent text-center w-full max-w-[240px] focus:outline-none placeholder:text-outline-variant tracking-tight" id="amount-input" inputmode="decimal" placeholder="0.00" type="text" value="450.00">
</div>
<!-- Quick Amount Increment Chips -->
<div class="flex items-center justify-center gap-2 pt-1 w-full overflow-x-auto">
<button class="px-2.5 py-1 rounded-full bg-surface-container-low text-primary font-label-sm text-label-sm hover:bg-surface-container transition-all active:scale-95" onclick="adjustAmount(50)" type="button">+ $50</button>
<button class="px-2.5 py-1 rounded-full bg-surface-container-low text-primary font-label-sm text-label-sm hover:bg-surface-container transition-all active:scale-95" onclick="adjustAmount(100)" type="button">+ $100</button>
<button class="px-2.5 py-1 rounded-full bg-surface-container-low text-primary font-label-sm text-label-sm hover:bg-surface-container transition-all active:scale-95" onclick="adjustAmount(200)" type="button">+ $200</button>
<button class="px-2.5 py-1 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm hover:bg-surface-container-high transition-all active:scale-95" onclick="clearAmount()" type="button">Borrar</button>
</div>
</div>
<!-- Main Expense Form Fields Card -->
<div class="bg-surface-container-lowest rounded-2xl p-5 shadow-sm flex flex-col gap-4">
<div class="flex items-center gap-2 pb-1 border-none">
<span class="material-symbols-outlined text-[18px] text-primary">edit_note</span>
<h2 class="font-label-lg text-label-lg text-on-surface">Detalles del movimiento</h2>
</div>
<!-- Concepto del gasto -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="concept-input">Concepto del gasto o compra</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-xs">
<input class="w-full h-12 px-3.5 bg-surface-container-low rounded-xl text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none placeholder:text-outline-variant transition-colors" id="concept-input" placeholder="Ej. Papelería, Almuerzo con cliente..." type="text" value="Insumos de cafetería, granos y leche">
</div>
</div>
<!-- Fecha con Picker -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="date-input">Fecha de emisión</label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-3.5 pr-11 bg-surface-container-low rounded-xl text-on-surface font-body-md text-body-md cursor-pointer select-none" id="date-input" readonly="" type="text" value="Hoy, 24 Octubre 2024">
<button aria-label="Cambiar fecha" class="absolute right-3 w-8 h-8 rounded-full flex items-center justify-center text-primary hover:bg-surface-container transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">calendar_today</span>
</button>
</div>
</div>
<!-- Comercio o Proveedor -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="vendor-input">Comercio o proveedor</label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-3.5 pr-11 bg-surface-container-low rounded-xl text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none placeholder:text-outline-variant transition-colors" id="vendor-input" placeholder="Nombre de la tienda o razón social" type="text" value="Distribuidora San Juan">
<span class="material-symbols-outlined absolute right-3.5 text-outline-variant text-[20px] pointer-events-none">storefront</span>
</div>
</div>
<!-- Referencia del comprobante -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="reference-input">Referencia del comprobante</label>
<span class="font-label-sm text-label-sm text-outline-variant">Opcional</span>
</div>
<div class="relative flex items-center">
<input class="w-full h-12 pl-3.5 pr-11 bg-surface-container-low rounded-xl text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none placeholder:text-outline-variant transition-colors" id="reference-input" placeholder="No. de ticket, factura o autorización" type="text" value="Folio: F-89212">
<span class="material-symbols-outlined absolute right-3.5 text-outline-variant text-[20px] pointer-events-none">tag</span>
</div>
</div>
</div>
<!-- Visual Attachment Preview Prompt (Receipt snapshot) -->

<!-- Tipo de Pago Selection (Chips) -->
<div class="bg-surface-container-lowest rounded-2xl p-5 shadow-sm flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="font-label-lg text-label-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary">credit_card</span>
          Método de pago
        </span>
<span class="font-label-sm text-label-sm text-on-surface-variant" id="selected-method-label">Débito</span>
</div>
<div class="grid grid-cols-2 gap-2.5 pt-1" id="payment-chips-group">
<!-- Efectivo -->
<button class="payment-chip flex items-center gap-2.5 px-3.5 py-3 rounded-xl bg-surface-container-low text-primary transition-all active:scale-95 text-left" onclick="selectPaymentMethod(this, 'Efectivo')" type="button">
<span class="material-symbols-outlined text-[18px]">payments</span>
<span class="font-label-md text-label-md font-semibold truncate">Efectivo</span>
</button>
<!-- Tarjeta de Crédito -->
<button class="payment-chip flex items-center gap-2.5 px-3.5 py-3 rounded-xl bg-surface-container-low text-primary transition-all active:scale-95 text-left" onclick="selectPaymentMethod(this, 'Tarjeta de crédito')" type="button">
<span class="material-symbols-outlined text-[18px]">credit_card</span>
<span class="font-label-md text-label-md font-semibold truncate">T. Crédito</span>
</button>
<!-- Tarjeta de Débito (Pre-selected) -->
<button class="payment-chip active-chip flex items-center gap-2.5 px-3.5 py-3 rounded-xl bg-primary text-on-primary shadow-sm transition-all active:scale-95 text-left" onclick="selectPaymentMethod(this, 'Tarjeta de débito')" type="button">
<span class="material-symbols-outlined text-[18px]">account_balance_wallet</span>
<span class="font-label-md text-label-md font-semibold truncate">T. Débito</span>
</button>
<!-- Transferencia -->
<button class="payment-chip flex items-center gap-2.5 px-3.5 py-3 rounded-xl bg-surface-container-low text-primary transition-all active:scale-95 text-left" onclick="selectPaymentMethod(this, 'Transferencia')" type="button">
<span class="material-symbols-outlined text-[18px]">sync_alt</span>
<span class="font-label-md text-label-md font-semibold truncate">Transferencia</span>
</button>
<!-- Pago Mixto (Full width) -->
<button class="payment-chip col-span-2 flex items-center justify-between px-3.5 py-3 rounded-xl bg-surface-container-low text-primary transition-all active:scale-95 text-left" onclick="selectPaymentMethod(this, 'Pago mixto')" type="button">
<div class="flex items-center gap-2.5">
<span class="material-symbols-outlined text-[18px]">pie_chart</span>
<span class="font-label-md text-label-md font-semibold">Pago mixto (Efectivo / Tarjeta)</span>
</div>
<span class="material-symbols-outlined text-[18px] opacity-60">chevron_right</span>
</button>
</div>
</div>
<!-- Category Tag Quick Selection -->

<!-- Action Buttons Section -->
<div class="flex flex-col gap-3 pt-2 pb-4">
<!-- Guardar Gasto (Primary Action) -->
<button class="w-full h-[52px] rounded-full bg-primary text-on-primary font-label-lg text-label-lg tracking-wide uppercase shadow-md flex items-center justify-center gap-2 transition-all active:scale-[0.98] hover:bg-primary-container" id="save-button" onclick="triggerSaveAnimation()" type="submit">
<span class="material-symbols-outlined text-[20px]">check</span>
        GUARDAR GASTO
      </button>
<!-- Cancelar (Secondary / Soft Tonal) -->
<button class="w-full h-[50px] rounded-full bg-surface-container-high text-primary font-label-lg text-label-lg transition-all active:scale-[0.98] hover:bg-surface-container-highest" onclick="history.back()" type="button">
        CANCELAR
      </button>
</div>
</form>
</div>
<script>
  function selectPaymentMethod(buttonEl, methodName) {
    const allChips = document.querySelectorAll('.payment-chip');
    allChips.forEach(chip => {
      chip.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm', 'active-chip');
      chip.classList.add('bg-surface-container-low', 'text-primary');
    });

    buttonEl.classList.remove('bg-surface-container-low', 'text-primary');
    buttonEl.classList.add('bg-primary', 'text-on-primary', 'shadow-sm', 'active-chip');

    const label = document.getElementById('selected-method-label');
    if (label) {
      label.textContent = methodName;
    }
  }

  function adjustAmount(delta) {
    const input = document.getElementById('amount-input');
    if (!input) return;
    let currentVal = parseFloat(input.value.replace(/[^0-9.]/g, '')) || 0;
    currentVal += delta;
    input.value = currentVal.toFixed(2);
  }

  function clearAmount() {
    const input = document.getElementById('amount-input');
    if (!input) return;
    input.value = '0.00';
    input.focus();
  }

  function triggerSaveAnimation() {
    const btn = document.getElementById('save-button');
    if (!btn) return;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">refresh</span> Guardando...';
    btn.classList.add('opacity-90');
    
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span> ¡Registrado!';
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-secondary');
      
      setTimeout(() => {
        if (typeof history !== 'undefined' && history.length > 1) {
          history.back();
        } else {
          btn.innerHTML = originalText;
          btn.classList.remove('bg-secondary', 'opacity-90');
          btn.classList.add('bg-primary');
        }
      }, 1000);
    }, 700);
  }
</script></main>



</body></html>
