<!-- Dark Vignette Overlay -->

<div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-inverse-surface/95 text-inverse-on-surface px-5 py-2.5 rounded-full shadow-xl flex items-center gap-2.5 transition-all duration-300 z-50 opacity-100 translate-y-0" id="capture-toast">
<span class="material-symbols-outlined text-[20px] text-secondary-fixed">check_circle</span>

</div>
</div>
<script>
  (function() {
    // Laser scanning animation logic
    const laser = document.getElementById('laser-line');
    let pos = 15;
    let direction = 1;
    function animateLaser() {
      if (!laser) return;
      pos += 0.5 * direction;
      if (pos > 85) direction = -1;
      if (pos < 15) direction = 1;
      laser.style.top = pos + '%';
      requestAnimationFrame(animateLaser);
    }
    requestAnimationFrame(animateLaser);

    // Flash light toggle
    const torchBtn = document.getElementById('torch-btn');
    const torchIcon = document.getElementById('torch-icon');
    const torchText = document.getElementById('torch-text');
    const flashOverlay = document.getElementById('flash-overlay');
    let isFlashOn = false;

    if (torchBtn) {
      torchBtn.addEventListener('click', () => {
        isFlashOn = !isFlashOn;
        if (isFlashOn) {
          torchIcon.textContent = 'flash_on';
          torchText.textContent = 'Encendido';
          flashOverlay.classList.remove('opacity-0');
          flashOverlay.classList.add('opacity-40');
        } else {
          torchIcon.textContent = 'flash_off';
          torchText.textContent = 'Flash';
          flashOverlay.classList.remove('opacity-40');
          flashOverlay.classList.add('opacity-0');
        }
      });
    }

    // Capture shutter click experience
    const captureBtn = document.getElementById('capture-btn');
    const toast = document.getElementById('capture-toast');
    const continueBtn = document.getElementById('continue-btn');

    function triggerCaptureFeedback() {
      // White shutter flash
      flashOverlay.classList.remove('opacity-0', 'transition-opacity');
      flashOverlay.classList.add('opacity-80');
      setTimeout(() => {
        flashOverlay.classList.add('transition-opacity');
        flashOverlay.classList.remove('opacity-80');
        if (!isFlashOn) {
          flashOverlay.classList.add('opacity-0');
        } else {
          flashOverlay.classList.add('opacity-40');
        }
      }, 90);

      // Show temporary toast
      if (toast) {
        toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
        }, 2200);
      }
    }

    if (captureBtn) {
      captureBtn.addEventListener('click', triggerCaptureFeedback);
    }

    if (continueBtn) {
      continueBtn.addEventListener('click', () => {
        triggerCaptureFeedback();
      });
    }
  })();
</script></main>
